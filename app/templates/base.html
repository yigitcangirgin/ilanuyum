<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}İlanUyum{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body data-page="{{ page }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="/">İlanUyum</a>
      {% block header_extra %}{% endblock %}
    </div>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">İlanUyum &middot; job application tracker</footer>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
