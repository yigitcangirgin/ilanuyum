{% extends "base.html" %}
{% block title %}İlanUyum - Job application tracker{% endblock %}
{% block content %}
<section class="hero">
  <h1>İlanUyum</h1>
  <p class="lead">Track every job application in one place: where you applied, where you stand, what is next.</p>
</section>

<div class="auth-grid">
  <section class="card" aria-labelledby="register-title">
    <h2 id="register-title">Create an account</h2>
    <form id="register-form" novalidate>
      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <small class="hint">At least 8 characters.</small>
      </div>
      <p class="form-error" id="register-error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Register</button>
    </form>
  </section>

  <section class="card" aria-labelledby="login-title">
    <h2 id="login-title">Log in</h2>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="username" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
  </section>
</div>
{% endblock %}
