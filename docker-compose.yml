services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ilanuyum
      POSTGRES_PASSWORD: ilanuyum
      POSTGRES_DB: ilanuyum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilanuyum -d ilanuyum"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ilanuyum:ilanuyum@db:5432/ilanuyum
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
